<!doctype html>
<!-- THROWAWAY PROPOSAL: three dashboard layouts carrying the approved loading
     screen's drafting grid, hatch gutters, registration corners and pink rules.
     Synthetic conversations only. No real services, writes or persisted state.
     Open with ?variant=A|B|C&appearance=dark|light&dark=charcoal|midnight|graphite.
     Not mounted by the app. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ThreadDeck · dashboard concepts</title>
<style>
@font-face{font-family:JetBrains;src:url('../public/fonts/JetBrainsMono-Regular.woff2') format('woff2')}
:root{color-scheme:dark;--ground:#101014;--surface:#17171e;--text:#eeeeef;--muted:#aaa7b8;--subtle:#85818f;--rule:#ffffff14;--grid:#ffffff08;--hatch:#ffffff19;--accent:#f77c9d;--ink:#f77c9d;--wash:#f77c9d0d;--glow:#f77c9d15;--green:#8fd9af;--green-wash:#8fd9af13;--amber:#f2be7e;--amber-wash:#f2be7e12}
:root[data-appearance=light]{color-scheme:light;--ground:#f4f3f6;--surface:#fff;--text:#25212e;--muted:#625d70;--subtle:#797183;--rule:#211b301b;--grid:#211b300a;--hatch:#211b3020;--ink:#bf365b;--wash:#f77c9d10;--glow:#f77c9d20;--green:#237947;--green-wash:#2379470d;--amber:#94601c;--amber-wash:#94601c0c}
:root[data-appearance=dark][data-dark=midnight]{--ground:#0b101b;--surface:#121c2b;--text:#ecf1fa;--muted:#a8b7ca;--subtle:#8393aa;--rule:#91acd224;--grid:#8eabdd0a;--hatch:#a7bce02c;--wash:#f77c9d0c;--glow:#8d9ef01c}
:root[data-appearance=dark][data-dark=graphite]{--ground:#19191e;--surface:#27272f;--text:#f4f4f6;--muted:#c1becd;--subtle:#a39fad;--rule:#ffffff28;--grid:#ffffff0a;--hatch:#ffffff30;--wash:#f77c9d13;--glow:#f77c9d0c}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--text);font:13px/1.5 JetBrains,monospace}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{color:inherit;background:none;border:0}h1,h2,p{margin:0}a{color:inherit}.native-bar{height:38px;border-bottom:1px solid var(--rule);display:flex;align-items:center;padding-left:14px;color:var(--muted);font-size:11px}.native-bar small{font-size:10px;letter-spacing:.7px;margin-left:10px}.native-controls{margin-left:auto;display:flex}.native-controls span{width:42px;display:grid;place-items:center;font-size:16px}.app{position:relative;max-width:1120px;margin:auto;padding:24px}.app:before{content:'';position:absolute;pointer-events:none;z-index:-1;inset:0 0 auto;height:270px;background-image:radial-gradient(ellipse at 25% 10%,var(--glow),transparent 58%),linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);background-size:auto,44px 44px,44px 44px;mask-image:linear-gradient(#000,transparent)}.brand{display:flex;align-items:center;gap:12px}.brand svg{width:35px;height:35px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.eyebrow{font-size:10px;letter-spacing:1.2px;color:var(--muted);margin-bottom:4px}h1{font-size:25px;letter-spacing:-1.2px;line-height:1.2}.brand-line{display:flex;align-items:center;justify-content:space-between;gap:10px}.header-tools{display:flex;gap:8px;align-items:center}.tool{border:1px solid var(--rule);width:30px;height:32px;color:var(--muted);font-size:14px}.connected{width:6px;height:6px;border-radius:50%;background:var(--green)}.accent-rule{height:2px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 25%,transparent) 60%,transparent);margin-top:24px}.micro{font-size:10px;letter-spacing:.8px;color:var(--muted)}.hatch{background:repeating-linear-gradient(135deg,transparent,transparent 5px,var(--hatch) 5px,var(--hatch) 6px)}.corners{position:absolute;inset:-5px;pointer-events:none}.corners b{position:absolute;width:10px;height:10px;border-style:solid;border-color:var(--subtle);border-width:0}.corners b:nth-child(1){left:0;top:0;border-top-width:1px;border-left-width:1px}.corners b:nth-child(2){right:0;top:0;border-top-width:1px;border-right-width:1px}.corners b:nth-child(3){left:0;bottom:0;border-bottom-width:1px;border-left-width:1px}.corners b:nth-child(4){right:0;bottom:0;border-bottom-width:1px;border-right-width:1px}.search{width:100%;height:42px;background:var(--surface);border:1px solid var(--rule);border-radius:0;color:var(--text);padding:0 13px;font-size:12px}.search::placeholder{color:var(--muted)}.filters{display:flex;gap:1px;align-items:center;justify-content:space-between;margin:12px 0 0}.filters button{padding:9px 6px;font-size:11px;color:var(--muted);border-bottom:2px solid transparent}.filters button.selected{border-color:var(--accent);color:var(--ink)}.filters .options{font-size:17px;padding:4px 2px}.toolbar{margin:22px 0}.caption{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px;color:var(--muted);font-size:10px;letter-spacing:.7px}.caption .mode{font-size:10px;letter-spacing:0;border:1px solid var(--rule);padding:4px 7px}.badge{font-size:10px;padding:3px 6px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;line-height:1.4}.badge.working{color:var(--green);background:var(--green-wash)}.badge.unread{color:var(--ink);background:var(--wash)}.badge.input{color:var(--amber);background:var(--amber-wash)}.dot{width:4px;height:4px;background:currentColor;border-radius:50%;display:inline-block}.project-tag{font-size:10px;padding:2px 5px;border:1px solid var(--rule);color:var(--muted)}.external{font-size:15px;color:var(--subtle)}.row-title{font-size:13px;line-height:1.5;font-weight:400}.row-meta{display:flex;gap:9px;align-items:center;margin-top:8px;color:var(--muted);font-size:10px}.quiet-footer{border-top:1px solid var(--rule);margin-top:24px;padding:16px 0;display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--muted)}.quiet-footer i{width:4px;height:4px;display:inline-block;background:var(--accent);border-radius:50%;margin-right:6px;vertical-align:middle}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-block:1px solid var(--rule)}.stats>div{padding:12px 8px;border-right:1px solid var(--rule)}.stats>div:first-child{padding-left:0}.stats>div:last-child{border-right:0}.stats strong{font-size:20px;font-weight:500;line-height:1}.stats small{display:block;color:var(--muted);font-size:10px;margin-top:7px}.stats .working-count{color:var(--green)}.stats .attention-count{color:var(--amber)}.empty{padding:30px 16px;color:var(--muted);text-align:center}
.app{isolation:isolate}
:root[data-appearance=dark][data-dark=midnight] :is(.project-panel,.lane,.inventory){background:linear-gradient(145deg,#132033,#101827)}
:root[data-appearance=dark][data-dark=graphite] :is(.project-panel,.lane,.inventory){background:#222229}
/* A — retain project grouping; replace soft islands with calm drafting frames. */
.a .projects{display:grid;gap:23px}.a .project-panel{position:relative;border:1px solid var(--rule);background:var(--ground)}.a .project-heading{display:flex;align-items:stretch;min-height:48px;border-bottom:1px solid var(--rule);background:linear-gradient(90deg,var(--wash),transparent)}.a .project-heading .hatch{width:12px;border-right:1px solid var(--rule);flex-shrink:0}.a .project-heading h2{font-size:14px;font-weight:500;padding:12px}.a .project-heading h2 span{color:var(--subtle);margin-right:6px}.a .project-count{margin-left:auto;align-self:center;padding-right:12px;font-size:10px;color:var(--muted)}.a .thread{padding:13px 15px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr 17px;gap:7px}.a .thread:last-child{border-bottom:0}.a .thread.unread{background:linear-gradient(90deg,var(--wash),transparent);border-left:2px solid var(--accent);padding-left:13px}.a .thread .external{align-self:center}.a .row-title{font-size:13px}.a .legend{margin-top:14px;color:var(--muted);font-size:10px}
/* B — attention is the hero; project identity lives on every thread. */
.b .brand svg{width:28px;height:28px}.b h1{font-size:20px}.b .headline{margin:25px 0 18px;font-size:26px;line-height:1.2;letter-spacing:-1px}.b .headline span{color:var(--muted);font-weight:400}.b .compact-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.b .compact-stats b{color:var(--text);font-weight:500}.b .lanes{display:grid;gap:23px}.b .lane{position:relative;border:1px solid var(--rule);background:var(--ground)}.b .lane-heading{display:flex;align-items:center;gap:9px;padding:13px 12px;border-bottom:1px solid var(--rule);font-size:12px;font-weight:500}.b .lane-heading .hatch{height:18px;width:13px;border-block:1px solid var(--rule)}.b .lane-heading small{font-size:10px;color:var(--muted);margin-left:auto}.b .lane.attention .lane-heading{color:var(--amber);background:linear-gradient(90deg,var(--amber-wash),transparent)}.b .lane.working .lane-heading{color:var(--green)}.b .lane-row{padding:15px 13px;border-bottom:1px solid var(--rule)}.b .lane-row:last-child{border-bottom:0}.b .lane-row .row-title{display:flex;justify-content:space-between;gap:12px}.b .lane-row .row-meta{flex-wrap:wrap}.b .lane.attention .lane-row{background:linear-gradient(90deg,var(--wash),transparent)}
/* C — one continuous, stable inventory rather than separate project cards. */
.c .brand-line{border-block:1px solid var(--rule);padding:15px 0}.c .brand svg{width:31px;height:31px}.c h1{font-size:24px}.c .summary-line{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:15px 0;color:var(--muted);border-bottom:1px solid var(--rule)}.c .summary-line b{font-weight:500;color:var(--text)}.c .toolbar{margin:20px 0}.c .inventory{position:relative;border:1px solid var(--rule);background:var(--ground)}.c .inventory-heading,.c .inventory-row{display:grid;grid-template-columns:9px minmax(0,1fr) 78px 68px}.c .inventory-heading{min-height:36px;border-bottom:1px solid var(--rule);font-size:10px;color:var(--muted);letter-spacing:.4px}.c .inventory-heading>span{padding:10px 7px;border-right:1px solid var(--rule)}.c .inventory-heading>span:first-child{padding:0}.c .inventory-heading>span:last-child{border-right:0}.c .inventory-row{min-height:99px;border-bottom:1px solid var(--rule)}.c .inventory-row:last-child{border-bottom:0}.c .inventory-row>.hatch{border-right:1px solid var(--rule)}.c .inventory-copy{padding:13px 10px;min-width:0}.c .inventory-copy .row-title{font-size:12px;overflow-wrap:anywhere}.c .inventory-copy .age{font-size:10px;color:var(--muted);margin-top:9px}.c .inventory-project{border-inline:1px solid var(--rule);padding:12px 5px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);overflow-wrap:anywhere}.c .inventory-state{display:flex;justify-content:center;align-items:center;font-size:10px}.c .inventory-state.working{color:var(--green)}.c .inventory-state.unread{color:var(--ink);background:var(--wash)}.c .inventory-state.input{color:var(--amber);background:var(--amber-wash)}.c .footnote{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;color:var(--muted);font-size:10px}
#switcher{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:8px;align-items:center;padding:7px;background:var(--text);color:var(--ground);border-radius:12px;box-shadow:0 8px 28px #0003;font-size:11px;white-space:nowrap}#switcher button{color:inherit;padding:4px 6px}#switcher strong{font-size:10px}#prototype-state{position:fixed;bottom:66px;left:0;right:0;text-align:center;color:var(--muted);font-size:10px;background:var(--ground)}body:not([data-capture=true]){padding-bottom:100px}body[data-capture=true] #switcher,body[data-capture=true] #prototype-state{display:none}@media(min-width:800px){.app{padding:38px 40px}.a .row-title,.b .row-title{font-size:14px}.a .thread{padding:16px 20px}.a .thread.unread{padding-left:18px}.a .project-heading h2{font-size:16px}.stats{max-width:560px}.toolbar{max-width:650px}.b .lanes{grid-template-columns:1fr 1.25fr;align-items:start}.b .headline{font-size:34px}.c .inventory-heading,.c .inventory-row{grid-template-columns:16px minmax(0,1fr) 170px 110px}.c .inventory-row{min-height:80px}.c .inventory-copy .row-title{font-size:14px}.c .inventory-project{font-size:12px}.c .inventory-state{font-size:11px}.c .inventory-copy{padding:16px}.caption{font-size:11px}.quiet-footer{margin-top:30px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="mark" transform="translate(4 4)"><path d="m16.02 12 5.48 3.13a1 1 0 0 1 0 1.74L13 21.74a2 2 0 0 1-2 0l-8.5-4.87a1 1 0 0 1 0-1.74L7.98 12"/><path d="M13 13.74a2 2 0 0 1-2 0L2.5 8.87a1 1 0 0 1 0-1.74L11 2.26a2 2 0 0 1 2 0l8.5 4.87a1 1 0 0 1 0 1.74Z"/></g></defs></svg>
<div class="native-bar">ThreadDeck <small>LOCAL</small><div class="native-controls"><span>−</span><span>□</span><span>×</span></div></div>
<div id="app"></div><div id="prototype-state"></div><nav id="switcher"><button id="prev" aria-label="Previous concept">←</button><strong id="name"></strong><button id="next" aria-label="Next concept">→</button><button id="theme">Light</button><button id="dark-style" aria-label="Cycle dark surface treatment">Charcoal</button></nav>
<script>
const params=new URLSearchParams(location.search),names={A:'Framed projects',B:'Attention lanes',C:'Thread ledger'};let variant=names[params.get('variant')]?params.get('variant'):'A',appearance=params.get('appearance')==='light'?'light':'dark',query='',filter='active';
const darkNames={charcoal:'Charcoal',midnight:'Midnight',graphite:'Graphite'};let darkStyle=darkNames[params.get('dark')]?params.get('dark'):'charcoal';
const threads=[{project:'ThreadDeck',title:'Polish startup loading',state:'working',age:'18s ago'},{project:'ThreadDeck',title:'Review local launcher flow',state:'unread',age:'3m ago'},{project:'WeekTrace',title:'Windows activity import',state:'working',age:'42s ago'},{project:'WeekTrace',title:'Review weekly report',state:'input',age:'6m ago'},{project:'naturalgas',title:'Compare saved backtests',state:'working',age:'1m ago'}];
const labels={working:'Working',unread:'Unread',input:'Needs input'},corners='<span class="corners" aria-hidden="true"><b></b><b></b><b></b><b></b></span>';
const brand=()=>'<div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#mark"/></svg><div><p class="eyebrow">YOUR AGENT SWITCHBOARD</p><h1>ThreadDeck</h1></div></div>';
const tools=()=>'<div class="header-tools"><span class="connected" title="Connected"></span><button class="tool" aria-label="Appearance">☼</button><button class="tool" aria-label="More options">≡</button></div>';
const badge=t=>`<span class="badge ${t.state}"><i class="dot"></i>${labels[t.state]}</span>`;
const footer=()=>'<footer class="quiet-footer"><span><i></i>LOCAL · READ ONLY</span></footer>';
const toolbar=()=>`<div class="toolbar"><input class="search" aria-label="Search projects or sessions" placeholder="⌕  Search projects or sessions…" value="${query.replaceAll('&','&amp;').replaceAll('"','&quot;')}"><div class="filters">${[['active','Active'],['all','All'],['working','Working'],['attention','Attention'],['recent','Recent']].map(([key,label])=>`<button data-filter="${key}" class="${filter===key?'selected':''}">${label}</button>`).join('')}<button class="options" aria-label="Thread options">⋮</button></div></div>`;
const stats=()=>'<div class="stats"><div><strong class="working-count">3</strong><small>working</small></div><div><strong class="attention-count">2</strong><small>need attention</small></div><div><strong>3</strong><small>active projects</small></div></div>';
const items=()=>threads.filter(t=>(t.title+' '+t.project).toLowerCase().includes(query.toLowerCase())&&(filter==='working'?t.state==='working':filter==='attention'?t.state!=='working':true));
function framedProjects(){const shown=items(),projects=[...new Set(shown.map(t=>t.project))];return `<div class="app a"><section class="brand-line">${brand()}${tools()}</section>${stats()}${toolbar()}<div class="caption"><span>PROJECTS ${String(projects.length).padStart(2,'0')}</span><button class="mode">By project⌄</button></div><div class="projects">${projects.map(name=>`<section class="project-panel">${corners}<div class="project-heading"><span class="hatch"></span><h2><span>⌄ #</span>${name}</h2><span class="project-count">${shown.filter(t=>t.project===name).length} threads</span></div>${shown.filter(t=>t.project===name).map(t=>`<div class="thread ${t.state}"><div><p class="row-title">${t.title}</p><div class="row-meta">${badge(t)}<span>${t.age}</span></div></div><span class="external">↗</span></div>`).join('')}</section>`).join('')||'<p class="empty">No matching threads.</p>'}</div>${footer()}</div>`}
function attentionLanes(){const shown=items(),groups=[['attention','Needs attention',shown.filter(t=>t.state!=='working')],['working','Working',shown.filter(t=>t.state==='working')]];return `<div class="app b"><section class="brand-line">${brand()}${tools()}</section><h2 class="headline">Attention first.<br><span>Everything else in view.</span></h2><div class="compact-stats"><span><b>3</b> working</span><span><b>2</b> need attention</span><span><b>3</b> projects</span></div><div class="accent-rule"></div>${toolbar()}<div class="caption"><span>LIVE THREADS</span><button class="mode">By state⌄</button></div><div class="lanes">${groups.filter(([, , rows])=>rows.length).map(([key,label,rows])=>`<section class="lane ${key}">${corners}<h2 class="lane-heading"><span class="hatch"></span>${label}<small>${rows.length} threads</small></h2>${rows.map(t=>`<div class="lane-row"><p class="row-title"><span>${t.title}</span><span class="external">↗</span></p><div class="row-meta"><span class="project-tag"># ${t.project}</span>${badge(t)}<span>${t.age}</span></div></div>`).join('')}</section>`).join('')||'<p class="empty">No matching threads.</p>'}</div>${footer()}</div>`}
function threadLedger(){const shown=items();return `<div class="app c"><section class="brand-line">${brand()}${tools()}</section><div class="summary-line"><span><b>3</b> working · <b>2</b> attention</span><span class="micro">3 PROJECTS</span></div>${toolbar()}<div class="caption"><span>LIVE INVENTORY</span><span>${shown.length} THREADS</span></div><div class="inventory">${corners}<div class="inventory-heading"><span class="hatch"></span><span>THREAD</span><span>PROJECT</span><span>STATE</span></div>${shown.map(t=>`<div class="inventory-row"><span class="hatch"></span><div class="inventory-copy"><p class="row-title">${t.title}</p><p class="age">${t.age} ↗</p></div><span class="inventory-project">${t.project}</span><span class="inventory-state ${t.state}">${t.state==='input'?'Input':labels[t.state]}</span></div>`).join('')||'<p class="empty">No matching threads.</p>'}</div><div class="footnote"><span>↗ Titles open Discord</span><span>Local read receipts</span></div>${footer()}</div>`}
function render(){document.documentElement.dataset.appearance=appearance;document.body.dataset.capture=params.get('capture')==='1';document.getElementById('app').innerHTML=({A:framedProjects,B:attentionLanes,C:threadLedger}[variant])();document.getElementById('name').textContent=variant+' · '+names[variant];document.getElementById('theme').textContent=appearance==='dark'?'Light':'Dark';document.getElementById('prototype-state').textContent=`SYNTHETIC · ${variant} · ${appearance} · ${filter} · 3 working / 2 attention`;params.set('variant',variant);params.set('appearance',appearance);history.replaceState(null,'','?'+params);for(const button of document.querySelectorAll('[data-filter]'))button.onclick=()=>{filter=button.dataset.filter;render()};document.querySelector('.search').oninput=event=>{query=event.target.value;const caret=event.target.selectionStart;render();const input=document.querySelector('.search');input.focus();input.setSelectionRange(caret,caret)}}
function cycle(direction){const keys=Object.keys(names);variant=keys[(keys.indexOf(variant)+direction+keys.length)%keys.length];render()}document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('theme').onclick=()=>{appearance=appearance==='dark'?'light':'dark';render()};window.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,[contenteditable]'))return;if(event.key==='ArrowLeft')cycle(-1);if(event.key==='ArrowRight')cycle(1)});render();
const renderLayout=render;render=function(){renderLayout();document.documentElement.dataset.dark=darkStyle;document.getElementById('dark-style').textContent=darkNames[darkStyle];document.getElementById('dark-style').hidden=appearance!=='dark';params.set('dark',darkStyle);history.replaceState(null,'','?'+params);document.getElementById('prototype-state').textContent+=appearance==='dark'?' · '+darkNames[darkStyle]:'';document.querySelectorAll('.project-count').forEach(element=>{if(element.textContent==='1 threads')element.textContent='1 thread'})};
document.getElementById('dark-style').onclick=()=>{const keys=Object.keys(darkNames);darkStyle=keys[(keys.indexOf(darkStyle)+1)%keys.length];render()};render();
</script>
</body>
</html>
