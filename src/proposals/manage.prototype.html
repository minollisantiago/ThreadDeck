<!doctype html>
<!-- THROWAWAY: compare three inbox-management layouts inside a sample ThreadDeck workspace.
     ?variant=A/B/C. Fixture-only actions; no persistence, fetches, or production integration. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThreadDeck · Proposal management mock</title>
<style>
:root{color-scheme:dark;--bg:#16151a;--panel:#1c1b21;--line:#34313c;--text:#dfdbe5;--muted:#96909f;--accent:#c6b2ed;--red:#efa4ac;font-family:system-ui,sans-serif;font-size:13px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--text);padding:8px 11px}button:hover{background:#ffffff09}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button.primary{background:var(--accent);color:#21172d;border-color:transparent}button.danger{color:var(--red)}button[aria-pressed=true]{background:#c6b2ed18;color:var(--accent)}small,.muted{color:var(--muted)}.titlebar{height:38px;border-bottom:1px solid var(--line);padding:10px 20px;font-size:11px;display:flex;justify-content:space-between}.shell{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 38px)}aside{border-right:1px solid var(--line);padding:24px 20px 100px}h1{font-size:20px;margin:0 0 22px;font-weight:500}.tabs{display:flex;gap:5px;margin-bottom:24px}.tabs button{flex:1;border:0}.counts{display:flex;gap:22px;margin-bottom:22px;color:var(--muted);font-size:11px}.counts b{color:var(--text);margin-right:4px}.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:10px;margin-bottom:12px}.filters{display:flex;gap:4px;flex-wrap:wrap}.filters button{font-size:11px;padding:6px 8px;border:0}.caption{display:flex;justify-content:space-between;margin:25px 0 13px;letter-spacing:1px;font-size:10px;color:var(--muted)}.project{margin-top:18px;font-size:12px}.row{display:flex;gap:10px;align-items:start;padding:13px 10px;border-radius:8px;margin-top:5px}.row:hover,.row.active{background:#ffffff05}.row .copy{flex:1;cursor:pointer;min-width:0}.row strong{font-size:12px;font-weight:450;line-height:1.6;display:block}.row small{display:block;font-size:10px;margin-top:4px}.row input{accent-color:var(--accent);margin-top:5px}.row button{padding:2px 6px;border:0}.row .pill{display:inline-block;padding:2px 5px;background:#99cfb914;color:#99cfb9;border-radius:4px;font-size:9px}main{min-width:0}.pane-head{height:86px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:20px 32px}.pane-head small{display:block;font-size:11px;margin-bottom:6px}.pane-head strong{font-weight:450}.document{max-width:810px;margin:auto;padding:44px 48px 130px}.kicker{font-size:10px;letter-spacing:1.5px;color:var(--accent)}h2{font-size:29px;font-weight:450;letter-spacing:-.7px;line-height:1.3;margin:18px 0}p{color:var(--muted);line-height:1.8}h3{font-size:12px;font-weight:500;margin-top:30px}.evidence{padding:14px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-family:monospace;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px}.management{padding:14px 0;border-top:1px solid var(--line);margin-top:22px}.management>button{width:100%;text-align:left;margin-top:7px}.selection{background:#25212f;border:1px solid #635573;padding:12px;border-radius:8px;margin-top:16px}.selection .actions{margin-top:10px}.selection small{display:block;margin-top:10px;line-height:1.6}.review-strip{border-bottom:1px solid var(--line);padding:18px 32px;background:var(--panel);display:flex;align-items:center;gap:14px;flex-wrap:wrap}.review-strip span{flex:1}.menu{position:absolute;right:0;top:42px;background:#25222c;padding:6px;border:1px solid var(--line);border-radius:9px;z-index:3;width:200px;box-shadow:0 12px 35px #0005}.menu button{display:block;width:100%;border:0;text-align:left}.menu-wrap{position:relative}.empty{text-align:center;padding:90px 20px}.empty h2{font-size:24px}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);border:1px solid #70627f;background:#30283c;padding:6px;display:flex;gap:6px;border-radius:12px;box-shadow:0 8px 35px #0005;z-index:5;white-space:nowrap}.switcher button{font-size:11px}.switcher label{align-self:center;font-size:10px;padding:0 8px;color:#c8b9d8}.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#302c39;border:1px solid var(--line);padding:12px 18px;border-radius:8px;z-index:8;max-width:90vw;font-size:12px}.toast button{margin-left:16px;padding:3px 9px}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;width:460px;max-width:calc(100vw - 32px);padding:26px}dialog::backdrop{background:#0009}dialog h2{font-size:21px;margin-top:0}dialog .actions{justify-content:flex-end}dialog .warning{border-left:2px solid var(--red);padding-left:13px}.reset{font-size:10px;color:var(--muted);border:0}.mobile-nav{display:none}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{border:0;padding-bottom:25px}main{border-top:1px solid var(--line)}.document{padding:25px 22px 125px}.pane-head{padding:18px 22px}.switcher{max-width:96vw;gap:2px}.switcher label{display:none}.switcher button{padding:8px;font-size:10px}.titlebar span:last-child{display:none}.review-strip{padding:15px 22px}}
</style></head><body>
<div class="titlebar"><span>◈ ThreadDeck</span><span>PROPOSAL MANAGEMENT · INTERACTIVE MOCK · SAMPLE DATA ONLY</span><button class="reset" id="reset">Reset sample data</button></div>
<div id="app"></div>
<nav class="switcher" aria-label="Prototype variants"><button id="previous" aria-label="Previous variant">←</button><label>LAYOUT</label><button data-variant="A">A · Inbox toolbar</button><button data-variant="B">B · Review mode</button><button data-variant="C">C · Inbox menu</button><button id="next" aria-label="Next variant">→</button></nav>
<dialog id="confirm"><h2 id="dialog-title"></h2><p id="dialog-description"></p><p id="dialog-warning" class="warning"></p><div class="actions"><button id="cancel">Cancel</button><button id="apply"></button></div></dialog>
<div id="notice" role="status" class="toast" hidden></div>
<script>
// All data stays in memory. Refresh and reset never contact a server.
const seed=[{id:1,project:'ThreadDeck',title:'Keep a draft when switching projects',status:'inbox',effort:'Small',summary:'Switching projects can discard an unsent prompt. Preserve each project’s draft until it is sent or cleared.'},{id:2,project:'ThreadDeck',title:'Show a retry action for failed attachments',status:'inbox',effort:'Medium',summary:'Keep failed attachments visible and allow retrying without selecting the files again.'},{id:3,project:'ThreadDeck',title:'Add keyboard navigation to proposals',status:'progress',effort:'Medium',summary:'Move between proposals using the keyboard without losing the current selection.'},{id:4,project:'TsCanvas',title:'Avoid unnecessary canvas redraws',status:'inbox',effort:'Small',summary:'Skip rendering when the viewport and scene have not changed.'},{id:5,project:'BeautifulData',title:'Keep chart filters in the URL',status:'inbox',effort:'Medium',summary:'Preserve filters when sharing a chart link or returning to a saved view.'}];
let data=structuredClone(seed),selected=new Set(),active=1,filter='inbox',query='',review=false,menu=false,pending=null,undo=null;
let variant=new URLSearchParams(location.search).get('variant');if(!['A','B','C'].includes(variant))variant='A';
const app=document.querySelector('#app'),dialog=document.querySelector('dialog');
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function visible(){return data.filter(p=>(filter==='all'||p.status===filter)&&(!query||(p.project+' '+p.title).toLowerCase().includes(query.toLowerCase())))}
function toast(message,canUndo=false){document.querySelector('#notice').hidden=false;document.querySelector('#notice').innerHTML=escape(message)+(canUndo?' <button id="undo">Undo</button>':'');document.querySelector('#undo')?.addEventListener('click',()=>{data=undo;undo=null;render();toast('Dismissal undone.');});}
function ask(kind,ids){ids=ids.filter(id=>data.some(p=>p.id===id&&(kind==='delete'||p.status==='inbox')));if(!ids.length)return;pending={kind,ids};const count=ids.length;document.querySelector('#dialog-title').textContent=kind==='delete'?`Delete ${count===1?'this proposal':count+' proposals'} permanently?`:`Dismiss ${count===1?'this proposal':count+' inbox proposals'}?`;document.querySelector('#dialog-description').textContent=kind==='delete'?'This removes the proposal and its decision history. Linked sessions are not deleted.':'These proposals move to Dismissed. Their evidence and decision history are retained.';document.querySelector('#dialog-warning').textContent=kind==='delete'?'A later scan may suggest the same work again. This cannot be undone.':'In-progress proposals are not affected. Future scans can use these decisions to avoid repeated suggestions.';document.querySelector('#apply').textContent=kind==='delete'?'Delete permanently':'Dismiss proposals';document.querySelector('#apply').className=kind==='delete'?'danger':'primary';dialog.showModal();}
function render(){const rows=visible(),inbox=data.filter(p=>p.status==='inbox'),p=data.find(p=>p.id===active&&rows.some(r=>r.id===p.id))||rows[0];if(p)active=p.id;const bulk=variant==='A'||(variant==='B'&&review);const chosen=[...selected].filter(id=>data.some(p=>p.id===id&&p.status==='inbox'));app.innerHTML=`<div class="shell"><aside><h1>ThreadDeck</h1><div class="tabs"><button>Threads</button><button>Schedules</button><button aria-pressed="true">Proposals</button></div><div class="counts"><span><b>${inbox.length}</b>inbox</span><span><b>${data.filter(p=>p.status==='progress').length}</b>in progress</span><span><b>3</b>projects</span></div><input class="search" aria-label="Search proposals" placeholder="Search projects or proposals…" value="${escape(query)}"><div class="filters">${['inbox','all','progress','dismissed'].map(f=>`<button data-filter="${f}" aria-pressed="${filter===f}">${{inbox:'Inbox',all:'All',progress:'In progress',dismissed:'Dismissed'}[f]}</button>`).join('')}</div>${variant==='A'?`<div class="selection"><div style="display:flex;justify-content:space-between;align-items:center"><label><input id="select-all" type="checkbox" ${rows.filter(p=>p.status==='inbox').length&&rows.filter(p=>p.status==='inbox').every(p=>selected.has(p.id))?'checked':''}> Select visible inbox</label><span class="muted">${chosen.length} selected</span></div><div class="actions"><button id="dismiss-selected" ${!chosen.length?'disabled':''}>Dismiss selected</button><button id="clear" ${!inbox.length?'disabled':''}>Clear inbox…</button></div><small>Clear inbox dismisses all ${inbox.length} inbox proposals, including items outside this filter.</small></div>`:''}<div class="caption"><span>PROJECTS</span><span>${rows.length} PROPOSALS</span></div>${['ThreadDeck','TsCanvas','BeautifulData'].map(project=>{const items=rows.filter(p=>p.project===project);return items.length?`<div class="project">⌄ &nbsp; # ${project}</div>${items.map(p=>`<div class="row ${active===p.id?'active':''}">${bulk?`<input type="checkbox" aria-label="Select ${escape(p.title)}" data-select="${p.id}" ${selected.has(p.id)?'checked':''} ${p.status!=='inbox'?'disabled':''}>`:''}<div class="copy" role="button" tabindex="0" data-open="${p.id}"><strong>${escape(p.title)}</strong><small>${p.status==='progress'?'<span class="pill">In progress</span>':p.status==='dismissed'?'Dismissed':p.effort+' · Observed'}</small></div></div>`).join('')}`:''}).join('')}${!rows.length?'<p class="muted">No proposals in this view.</p>':''}${variant==='B'?`<div class="management"><button id="review">${review?'Exit review mode':'Review inbox…'}</button><small>Select inbox proposals to dismiss in one action.</small></div>`:''}</aside><main><header class="pane-head"><div><small># ${p?escape(p.project):'Proposals'}</small><strong>${p?escape(p.title):'Proposals'}</strong></div><div style="display:flex;gap:8px"><button id="refresh" aria-label="Refresh proposals" title="Reload saved proposals; does not scan projects">↻</button>${variant==='C'?`<div class="menu-wrap"><button id="menu" aria-label="Inbox actions" aria-expanded="${menu}">•••</button>${menu?`<div class="menu"><button id="clear" ${!inbox.length?'disabled':''}>Clear inbox… <small>${inbox.length}</small></button>${p?`<button id="delete" class="danger">Delete this proposal…</button>`:''}</div>`:''}</div>`:''}</div></header>${variant==='B'&&review?`<div class="review-strip"><span><b>${chosen.length}</b> selected <small>· Inbox only</small></span><button id="select-visible">Select visible</button><button id="dismiss-selected" ${!chosen.length?'disabled':''}>Dismiss selected</button><button id="clear" ${!inbox.length?'disabled':''}>Clear inbox…</button></div>`:''}${p?`<article class="document"><span class="kicker">PROPOSAL · ${p.status==='progress'?'IN PROGRESS':p.status.toUpperCase()}</span><h2>${escape(p.title)}</h2><p>${escape(p.summary)}</p><h3>Why this matters</h3><p>This interrupts the current workflow and requires repeating an action. Keep the change scoped to the affected interaction.</p><h3>Evidence</h3><div class="evidence">src/${p.project==='ThreadDeck'?'chat/project-drafts.ts':'workspace/state.ts'}<br><br>Observed in the sample project review.</div><h3>Starting prompt</h3><p>Investigate the behavior above, check the existing tests, and propose a focused fix before making changes.</p><div class="actions">${p.status==='inbox'?'<button id="start" class="primary">Start session</button><button id="dismiss-one">Dismiss</button>':''}${variant!=='C'?'<button id="delete" class="danger">Delete permanently…</button>':''}${p.status==='progress'?'<small>Linked session · Working on keyboard navigation</small>':''}</div></article>`:'<div class="empty"><h2>No proposals in this view</h2><p>Dismissed proposals remain available under Dismissed.</p><button id="show-dismissed">View dismissed</button></div>'}</main></div>`;
document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===variant));
app.querySelector('.search').oninput=e=>{const cursor=e.target.selectionStart;query=e.target.value;render();const input=app.querySelector('.search');input.focus();input.setSelectionRange(cursor,cursor);};
app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;selected.clear();render();});
app.querySelectorAll('[data-open]').forEach(b=>{b.onclick=()=>{active=Number(b.dataset.open);render();};b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.click();}};});
app.querySelectorAll('[data-select]').forEach(b=>b.onchange=()=>{const id=Number(b.dataset.select);b.checked?selected.add(id):selected.delete(id);render();});
const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
bind('select-all',e=>{rows.filter(p=>p.status==='inbox').forEach(p=>e.target.checked?selected.add(p.id):selected.delete(p.id));render();});bind('select-visible',()=>{rows.filter(p=>p.status==='inbox').forEach(p=>selected.add(p.id));render();});bind('dismiss-selected',()=>ask('dismiss',chosen));bind('clear',()=>ask('dismiss',inbox.map(p=>p.id)));bind('dismiss-one',()=>ask('dismiss',[active]));bind('delete',()=>ask('delete',[active]));bind('review',()=>{review=!review;selected.clear();render();});bind('menu',()=>{menu=!menu;render();});bind('refresh',()=>toast('Saved proposals reloaded. No scan started. (Simulation)'));bind('show-dismissed',()=>{filter='dismissed';render();});bind('start',()=>toast('Session creation is not connected in this mock.'));
}
document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#apply').onclick=()=>{if(!pending)return;const{kind,ids}=pending;undo=kind==='dismiss'?structuredClone(data):null;data=kind==='delete'?data.filter(p=>!ids.includes(p.id)):data.map(p=>ids.includes(p.id)?{...p,status:'dismissed'}:p);selected.clear();menu=false;dialog.close();render();toast(`${ids.length} proposal${ids.length===1?'':'s'} ${kind==='delete'?'deleted':'dismissed'}.`,kind==='dismiss');pending=null;};
function choose(v){variant=v;review=false;menu=false;selected.clear();const url=new URL(location.href);url.searchParams.set('variant',v);history.replaceState(null,'',url);render();}
function cycle(n){const list=['A','B','C'];choose(list[(list.indexOf(variant)+n+3)%3]);}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>choose(b.dataset.variant));document.querySelector('#previous').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);
document.addEventListener('keydown',e=>{if(dialog.open||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1);}});
document.querySelector('#reset').onclick=()=>{data=structuredClone(seed);selected.clear();active=1;filter='inbox';query='';review=false;menu=false;document.querySelector('#notice').hidden=true;render();};render();
</script></body></html>
