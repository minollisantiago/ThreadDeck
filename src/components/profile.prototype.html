<!doctype html>
<!-- Throwaway study: three profile/settings treatments in the existing dashboard context.
     Open directly with ?variant=A|B|C. Fictional identity; all controls are local only. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThreadDeck · Profile study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101013;color:#eeedf2;font:14px system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #fa7da8;outline-offset:3px}.board{width:564px;margin:32px auto 90px}.caption{height:68px;display:flex;justify-content:space-between;align-items:start}.caption strong{font-size:17px}.caption small{display:block;color:#a7a2b0;font-size:12px;margin-top:8px}.tag{color:#f482ad;font:11px monospace;padding-top:4px}.app{height:1000px;position:relative;background:#19191e;border:1px solid #35343e;border-radius:14px;overflow:hidden}.top{display:flex;align-items:center;gap:12px;padding:25px 20px}.logo{display:grid;place-items:center;background:#352832;color:#ff7ba8;width:40px;height:40px;border-radius:14px;font-size:29px}.brand{font-size:23px;letter-spacing:-.7px}.window{margin-left:auto;color:#b2adbe;letter-spacing:18px;font-size:20px}.tools{display:flex;gap:6px;padding:0 14px;margin-bottom:16px}.pill{padding:8px;border-radius:10px;font:11px monospace;background:#293332;color:#a4e7c5}.pill.amber{background:#382f2b;color:#ffc080}.pill.pink{background:#352831;color:#ff84ae}.search{margin:0 14px;border:1px solid #45434e;border-radius:8px;padding:13px;color:#c3bed2;font:13px monospace;background:#232229}.tabs{display:flex;gap:20px;margin:19px 18px 30px;font:12px monospace;color:#c9c4d8}.tabs span:first-child{color:#ff85ae;border-bottom:2px solid #ff85ae;padding-bottom:10px}.projects{padding:0 18px;font:11px monospace;letter-spacing:2px;color:#b4adbf}.project{padding:28px 24px 8px;font:14px monospace;display:flex;gap:14px;align-items:center}.project small{margin-left:auto;font:10px monospace;background:#2c2b35;padding:7px;border-radius:20px;color:#b3acc7}.threads{margin:8px 32px 15px 48px;border-left:2px solid #52505d}.thread{height:44px;display:flex;align-items:center;gap:10px;position:relative;margin-left:19px;padding:0 10px;color:#c2bdcf;font:13px monospace}.thread:before{content:'';position:absolute;left:-20px;width:19px;border-top:2px solid #52505d}.thread.selected{background:#2d2b35;border-radius:8px}.thread.selected:after{content:'';position:absolute;left:0;height:21px;width:3px;background:#ff87b2;border-radius:4px}.thread .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.state{font:10px monospace;padding:6px 8px;border-radius:20px;background:#302f39;color:#cbc6d6}.state.working{color:#a7e6c4;background:#293431}.pin{color:#f383ad;font-size:14px}.external{color:#9b95a8}.footer{position:absolute;bottom:0;width:100%;height:64px;background:#19191e;border-top:1px solid #2b2932;display:flex;align-items:center;justify-content:space-between;padding:0 17px}.hint{color:#aaa4bb;font:10px monospace}.avatar{width:35px;height:35px;flex-shrink:0;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#aa83e3,#6d4ba6);color:#fff1ff;font-weight:650;font-size:13px;border:1px solid #d2b0ff55;box-shadow:inset 0 0 0 3px #ffffff0b}.avatar.big{width:48px;height:48px;border-radius:15px;font-size:18px}.avatar-button{padding:4px;background:#29262f;border:1px solid #49404e;border-radius:15px}.panel{position:absolute;background:#25232c;border:1px solid #4b414f;border-radius:15px;box-shadow:0 16px 50px #0008;overflow:hidden}.identity{display:flex;gap:12px;align-items:center;padding:20px}.identity strong{font-size:16px;display:block}.muted{font-size:12px;color:#b2aabd;margin-top:4px}.source{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:#c0b4ed;background:#393047;border-radius:6px;padding:4px 7px;margin-top:9px}.rule{height:1px;background:#3a3441;margin:0 16px}.row{display:flex;align-items:center;gap:12px;padding:13px 18px;width:100%;background:none;border:0;text-align:left;font-size:13px}.row .icon{font-size:17px;width:19px;color:#c3b6d3}.row .end{margin-left:auto;color:#a69aae;font-size:12px}.row:hover{background:#ffffff07}.connection{display:flex;align-items:center;gap:8px;padding:14px 18px;background:#201f26;color:#b9cbbf;font:11px monospace}.dot{width:7px;height:7px;border-radius:50%;background:#84bd9d;display:inline-block}.connection small{margin-left:auto;color:#9a93a6;font-size:10px}.menu{bottom:77px;right:16px;width:294px}.menu .identity{padding:18px}.mini-label{font:10px monospace;color:#a9a0b6;letter-spacing:1.5px;padding:18px 18px 9px}.switch{width:31px;height:18px;background:#aa6386;border-radius:20px;display:inline-flex;align-items:center;padding:3px;margin-left:auto}.switch:after{content:'';width:12px;height:12px;border-radius:50%;background:#ffe8f2;margin-left:auto}.switch.off{background:#49414e}.switch.off:after{margin-left:0;background:#c2b7cd}.identity-footer{justify-content:initial;gap:10px;height:76px}.identity-footer .more{margin-left:auto;background:none;border:0;color:#bdb2c9;font-size:20px}.identity-footer strong{font-size:13px}.identity-footer .muted{font-size:10px}.preferences{left:14px;right:14px;bottom:89px}.preferences .row{padding:11px 18px}.section-heading{display:flex;align-items:center;justify-content:space-between;padding:18px;font-size:15px;font-weight:600}.section-heading span{font-size:10px;color:#b5a5c7;font-weight:400}.chips{display:flex;gap:7px;padding:3px 18px 17px}.chip{border:1px solid #504658;background:#2d2834;padding:8px 12px;border-radius:7px;font-size:11px}.chip.active{background:#493041;color:#ffabd0;border-color:#a26183}.scrim{position:absolute;inset:0;background:#0005}.drawer{right:0;top:0;bottom:0;width:355px;border-radius:16px 0 0 16px;border-right:0;background:#222027}.drawer .identity{padding-top:8px}.drawer .section-heading{padding:24px 20px}.drawer .mini-label{padding-top:27px}.drawer .row{padding:14px 20px}.drawer .connection{position:absolute;bottom:0;left:0;right:0;display:block;line-height:2}.drawer .connection small{display:block;margin-left:15px}.select{margin-left:auto;background:#302b36;border:1px solid #514555;border-radius:6px;padding:5px 8px;font-size:11px;color:#ded2e8}.note{margin:13px 20px;padding:12px;border:1px solid #3f3649;border-radius:8px;color:#b9acc8;font-size:11px;line-height:1.6;background:#2a2432}.switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:20px;align-items:center;padding:9px 12px;border-radius:30px;background:#f4eaf2;color:#302133;box-shadow:0 5px 25px #0008;font-size:12px;z-index:10}.switcher button{border:0;background:#e6d6e2;color:#302133;border-radius:50%;width:28px;height:28px}.capture .switcher{display:none}#feedback{position:absolute;left:18px;top:75px;z-index:4;color:#ffd2e5;background:#493041;border-radius:8px;padding:10px;font-size:12px;display:none}@media(max-width:590px){.board{width:calc(100% - 24px)}.caption strong{font-size:15px}.drawer{width:min(355px,92%)}}
</style>
<div class="board"><div class="caption"><div><strong id="heading"></strong><small id="subtitle"></small></div><span class="tag">PROFILE STUDY / <span id="letter"></span></span></div><main class="app"><div class="top"><div class="logo">♧</div><div class="brand">ThreadDeck</div><div class="window">⚙ ×</div></div><div class="tools"><span class="pill">1 working</span><span class="pill amber">0 attention</span><span class="pill pink">2 active</span></div><div class="search">⌕ &nbsp;Search projects or sessions…</div><div class="tabs"><span>Active</span><span>All</span><span>Working</span><span>Attention</span><span>Recent</span></div><div class="projects">PROJECTS &nbsp;02</div><div class="project">⌄ <span style="color:#a39bae">#</span> TsCanvas <small>6 sessions</small> ＋</div><div class="threads" id="first"></div><div class="project">⌄ <span style="color:#a39bae">#</span> ThreadDeck <small>7 sessions</small> ＋</div><div class="threads" id="second"></div><div id="surface"></div><div id="feedback"></div></main></div><nav class="switcher"><button id="prev" aria-label="Previous variant">←</button><span id="current"></span><button id="next" aria-label="Next variant">→</button></nav>
<script>
const variants=['A','B','C'];let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants.includes(variant))variant='A';
const identity=`<div class="identity"><div class="avatar big">SA</div><div><strong>Santiago</strong><div class="muted">@santiago</div><div class="source">◈ &nbsp; From Discord</div></div></div>`;
const status=`<div class="connection"><span class="dot"></span> Backend connected <small>Kimaki · local</small></div>`;
const row=(icon,label,end='›')=>`<button class="row"><span class="icon">${icon}</span>${label}<span class="end">${end}</span></button>`;
const toggle=(label,on=true)=>`<button class="row toggle">${label}<span class="switch ${on?'':'off'}"></span></button>`;
const avatarFooter=`<footer class="footer"><span class="hint">Titles open chat ↗ &nbsp;/&nbsp; ⤢ opens browser</span><button class="avatar-button" aria-label="Toggle profile"><span class="avatar">SA</span></button></footer>`;
const names={A:['A · The quiet corner','A small avatar. Everything else stays where it is.'],B:['B · The personal dock','Identity stays visible; quick preferences live one click away.'],C:['C · Your control room','A dedicated drawer for profile, preferences and connection.']};
function render(){document.querySelector('#heading').textContent=names[variant][0];document.querySelector('#subtitle').textContent=names[variant][1];document.querySelector('#letter').textContent=variant;document.querySelector('#current').textContent=names[variant][0];
document.querySelector('#surface').innerHTML=variant==='A'?`${avatarFooter}<section class="panel menu">${identity}<div class="rule"></div>${row('◐','Appearance','Dark ›')}${row('♧','Notifications')}${row('⚙','All preferences')}<div class="rule"></div>${row('◈','View Discord profile','↗')}${status}</section>`:variant==='B'?`<footer class="footer identity-footer"><div class="avatar">SA</div><div><strong>Santiago</strong><div class="muted"><span class="dot"></span> Backend connected</div></div><span class="source" style="margin:0 0 0 auto">◈ Discord</span><button class="more" aria-label="Toggle profile">⌃</button></footer><section class="panel preferences"><div class="section-heading">Make yourself at home <span>LOCAL PREFERENCES</span></div><div class="mini-label" style="padding-top:0">APPEARANCE</div><div class="chips"><button class="chip active">◐ Dark</button><button class="chip">☀ Light</button><button class="chip">▣ System</button></div><div class="rule"></div>${toggle('Completion alerts')}${toggle('Attention alerts')}${toggle('Notification sounds',false)}<div class="rule"></div>${row('☷','Session density','Comfortable ›')}${row('⚙','All preferences')}${row('◈','Santiago · Discord profile','↗')}</section>`:`${avatarFooter}<div class="scrim"></div><section class="panel drawer"><div class="section-heading">Your space <button style="border:0;background:none;color:#b9adca" aria-label="Toggle profile">×</button></div>${identity}<div class="note">Your name and avatar come from Discord. Preferences apply only to ThreadDeck.</div><div class="mini-label">APPEARANCE</div><div class="chips"><button class="chip active">◐ Dark</button><button class="chip">☀ Light</button><button class="chip">▣ System</button></div><button class="row">Text size <span class="select">Default ⌄</span></button><button class="row">Session density <span class="select">Comfortable ⌄</span></button><div class="mini-label">NOTIFICATIONS</div>${toggle('When a session finishes')}${toggle('When attention is needed')}${toggle('Play a sound',false)}<div class="mini-label">IDENTITY</div>${row('◈','View Discord profile','↗')}${row('⟳','Refresh name & avatar','')}<div class="connection"><span class="dot"></span> &nbsp; Backend connected<small>Kimaki · local connection · Not Discord presence</small></div></section>`;
document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>b.querySelector('.switch').classList.toggle('off'));
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));b.classList.add('active')});
document.querySelectorAll('[aria-label="Toggle profile"]').forEach(b=>b.onclick=()=>{const panel=document.querySelector('.panel');panel.hidden=!panel.hidden;const scrim=document.querySelector('.scrim');if(scrim)scrim.hidden=panel.hidden});
document.querySelectorAll('.row:not(.toggle)').forEach(b=>b.onclick=()=>{const feedback=document.querySelector('#feedback');feedback.textContent='Visual mock only · '+b.textContent.trim();feedback.style.display='block';setTimeout(()=>feedback.style.display='none',1800)});
}
const titles=[['Planning macro-data caches in TsCanvas','ive detected a weird bug when i c…','i’ve noticed the portfo…','take a look at the fuzzy finder w…','i want you to investigate the fol…','Unify watchlist shortcut tooltips'],['we need to allow the user to chan…','we have a contrast problem on lig…','i want to support slash commands…','UI changes, one change → one…','how to discover new projects to s…','Brainstorm and investigate a new…']];
titles.forEach((items,index)=>document.querySelector(index?'#second':'#first').innerHTML=items.map((title,i)=>`<div class="thread ${!index&&!i?'selected':''}"><span class="title">${title}</span><span class="state ${!index&&!i?'working':''}">• ${!index&&!i?'Working':'Idle'}</span><span class="pin">⚑</span><span class="external">↗</span></div>`).join(''));
function cycle(delta){variant=variants[(variants.indexOf(variant)+delta+3)%3];const url=new URL(location);url.searchParams.set('variant',variant);history.replaceState({},'',url);render()}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');render();
</script>
</html>
